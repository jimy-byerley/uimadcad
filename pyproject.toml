[project]
name = "uimadcad"
version = "0.8.2"
requires-python = ">= 3.10"
dependencies = [
	"pymadcad[ply,stl] ~= 1.0.2",
	"pyqt5 ~= 5.11",
	"pyyaml ~= 6.0",
	"pnprint ~= 1.3",
	"processional ~= 0.1.4",
	"threadpoolctl ~= 3.0",
	]
authors = [{name = "jimy byerley", email = "jimy.byerley@gmail.com"}]
license = {file = "LICENSE"}
description = "user-friendly graphical environment for madcad"
readme = "readme.md"
classifiers = [
	"License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
	"Topic :: Scientific/Engineering",
	"Programming Language :: Python :: 3.8",
	"Programming Language :: Python :: 3.9",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: Implementation :: CPython",
	"Intended Audience :: Science/Research",
	"Intended Audience :: Manufacturing",
	"Intended Audience :: Education",
	"Topic :: Scientific/Engineering",
	"Topic :: Scientific/Engineering :: Visualization",
	"Environment :: X11 Applications :: Qt",
	]

[project.optional-dependencies]
test = [
	"pytest >= 7",
	"pytest-qt >= 4",
	]

[project.urls]
Home = "https://madcad.netlify.com"
Repository = "https://github.com/jimy-byerley/uimadcad"

[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"


# enhance pytest default output
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-v -rF --no-header --force-short-summary"
markers = [
	"gl: test requires an OpenGL context (3d viewport); skipped when none is available",
	]
