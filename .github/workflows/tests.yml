name: tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install system libraries for Qt / OpenGL (headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb libegl1 libgl1 libdbus-1-3 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-shape0 libxcb-cursor0
      - name: Install project
        run: uv sync --extra test
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run -a uv run pytest tests/
